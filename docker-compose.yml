# docker-compose.yml
services:
  # 后端服务定义
  backend:
    build:
      context: .  # 使用项目根目录作为构建上下文
      dockerfile: backend/Dockerfile
    container_name: dqct_backend
    volumes:
      - ./config.yaml:/config.yaml
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1

  # 前端服务定义
  frontend:
    build: ./frontend
    container_name: dqct_frontend
    ports:
      # 将用户主机的8080端口映射到容器的80端口，通过 http://localhost:8080 访问
      - "8080:80"
    depends_on:
      - backend